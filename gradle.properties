org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 禁止 AGP 自动下载缺失的 SDK 组件:它走 dl.google.com,本网络不可达,
# 失败时的报错还会盖住真正的原因(2026-09-10 踩过)。
android.builder.sdkDownload=false
# 检查更新通道(M7 T9,spec §7.3):逗号分隔、按顺序尝试,每个都必须是 https。
# 不写 = 只有 GitHub Release。拿到 COS 桶之后取消下一行的注释并填上(COS 在前、GitHub 在后):
# unitedu.updateUrls=https://<bucket>.cos.<region>.myqcloud.com/unitedu/latest.json,https://github.com/GordonWang1878/UnitedU-launcher/releases/latest/download/latest.json
